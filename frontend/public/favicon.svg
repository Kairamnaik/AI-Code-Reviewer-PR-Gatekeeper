<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    
    <!-- Code Accent Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Shape (Gatekeeper) -->
  <path d="M50 12 L82 24 C82 55 68 76 50 88 C32 76 18 55 18 24 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="drop-shadow(0px 4px 8px rgba(79, 70, 229, 0.25))" />

  <!-- Inner Shield Highlight line -->
  <path d="M50 18 L76 28 C76 53 64 71 50 81 C36 71 24 53 24 28 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.3" 
        stroke-width="1.5" />

  <!-- Code brackets in the center (Code Reviewer) -->
  <!-- Left Bracket < -->
  <path d="M36 42 L26 50 L36 58" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Bracket > -->
  <path d="M64 42 L74 50 L64 58" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- AI Sparkle in the top-right corner of inner shield -->
  <path d="M62 30 Q62 36 68 36 Q62 36 62 42 Q62 36 56 36 Q62 36 62 30 Z" 
        fill="url(#sparkleGrad)" 
        filter="drop-shadow(0px 1px 3px rgba(245, 158, 11, 0.3))" />

  <!-- Git Branch Nodes / Security Lock in the center -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
  
  <!-- Vertical branch line connecting nodes -->
  <line x1="50" y1="36" x2="50" y2="64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Left Branch Node -->
  <path d="M50 56 Q42 56 42 64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="42" cy="64" r="3" fill="url(#codeGrad)" stroke="#ffffff" stroke-width="1" />
  
  <!-- Top Main Node -->
  <circle cx="50" cy="36" r="3" fill="#ffffff" />
  <circle cx="50" cy="64" r="3" fill="#ffffff" />
</svg>