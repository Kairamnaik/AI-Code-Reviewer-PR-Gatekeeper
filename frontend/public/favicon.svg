<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" /> <!-- Violet -->
      <stop offset="50%" stop-color="#3B82F6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan -->
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shieldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Protective Shield (Gatekeeper) -->
  <path d="M256 32 C150 70 96 120 96 240 C96 360 180 435 256 480 C332 435 416 360 416 240 C416 120 362 70 256 32 Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="28" 
        stroke-linejoin="round" 
        fill="#0B0F19" 
        fill-opacity="0.9"
        filter="url(#shieldGlow)" />

  <!-- Code Brackets (Static Code/PR) -->
  <!-- Left Bracket < -->
  <path d="M195 185 L125 256 L195 327" 
        stroke="#8B5CF6" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
        
  <!-- Right Bracket > -->
  <path d="M317 185 L387 256 L317 327" 
        stroke="#06B6D4" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- AI Scanner / Target Reticle (AI Reviewer) -->
  <circle cx="256" cy="256" r="50" stroke="url(#eyeGrad)" stroke-width="6" stroke-dasharray="16 8" fill="none" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="url(#eyeGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />

  <!-- Horizontal Laser Scan Line (PR scanning animation representation) -->
  <path d="M80 256 L432 256" 
        stroke="url(#lineGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        filter="url(#glow)" />
</svg>